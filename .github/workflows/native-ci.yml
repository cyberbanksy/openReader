name: Native apps

on:
  push:
    paths:
      - 'native/**'
      - 'scripts/build-android.sh'
      - 'scripts/build-apple.sh'
      - '.github/workflows/native-ci.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/build-android.sh'
      - 'scripts/build-apple.sh'
      - '.github/workflows/native-ci.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android 17 SDK
        run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Verify Android app
        run: native/android/gradlew -p native/android --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: openreader-android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple package
        run: swift test --package-path native/apple
